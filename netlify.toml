# Netlify: builds and hosts the React frontend. The FastAPI backend runs on Render (see render.yaml).
# Required site environment variable:  VITE_API_BASE = https://<your-render-service>.onrender.com

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path serves index.html (the app uses #hash routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # the app needs the microphone (voice questions), camera (crop photos) and location (weather)
    Permissions-Policy = "microphone=(self), camera=(self), geolocation=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
